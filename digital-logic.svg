<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#dlBg)"/>

  <!-- Title Badge -->
  <rect x="50" y="30" width="460" height="34" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="65" y="52" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="13" font-weight="700">PROJECT 05: DIGITAL ELECTRONICS &amp; LOGIC CIRCUITS</text>

  <!-- Left: IC 7485 4-Bit Magnitude Comparator & Adder -->
  <g transform="translate(50, 90)">
    <rect width="360" height="320" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="30" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">IC 7485 4-Bit Magnitude Comparator</text>

    <!-- IC Chip Package -->
    <rect x="110" y="60" width="140" height="180" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="165" y="60" width="30" height="10" rx="2" fill="#090d16"/>
    <text x="180" y="115" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">74LS85</text>
    <text x="180" y="135" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">4-Bit Comparator</text>

    <!-- Input Pins Left (A0-A3, B0-B3) -->
    <g stroke="#38bdf8" stroke-width="2">
      <line x1="40" y1="85" x2="110" y2="85"/>
      <line x1="40" y1="110" x2="110" y2="110"/>
      <line x1="40" y1="135" x2="110" y2="135"/>
      <line x1="40" y1="160" x2="110" y2="160"/>
      <line x1="40" y1="185" x2="110" y2="185"/>
      <line x1="40" y1="210" x2="110" y2="210"/>
    </g>
    <text x="35" y="89" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="end">A[3..0]</text>
    <text x="35" y="164" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="end">B[3..0]</text>

    <!-- Output Pins Right (A>B, A=B, A<B) -->
    <g stroke="#10b981" stroke-width="2">
      <line x1="250" y1="100" x2="315" y2="100"/>
      <line x1="250" y1="145" x2="315" y2="145"/>
      <line x1="250" y1="190" x2="315" y2="190"/>
    </g>
    <circle cx="320" cy="100" r="4" fill="#10b981"/>
    <circle cx="320" cy="145" r="4" fill="#10b981"/>
    <circle cx="320" cy="190" r="4" fill="#10b981"/>
    <text x="330" y="104" fill="#10b981" font-family="monospace" font-size="10">A &gt; B</text>
    <text x="330" y="149" fill="#10b981" font-family="monospace" font-size="10">A = B</text>
    <text x="330" y="194" fill="#10b981" font-family="monospace" font-size="10">A &lt; B</text>

    <!-- Summary Box -->
    <rect x="20" y="255" width="320" height="50" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="30" y="275" fill="#38bdf8" font-family="monospace" font-size="10">• Cascading Inputs I(A&gt;B), I(A=B), I(A&lt;B)</text>
    <text x="30" y="293" fill="#94a3b8" font-family="monospace" font-size="10">• TTL Logic Family Experiment Verification</text>
  </g>

  <!-- Right: 4-Bit Ripple Carry Adder & MUX -->
  <g transform="translate(430, 90)">
    <rect width="320" height="320" rx="8" fill="#050914" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="30" fill="#a855f7" font-family="monospace" font-size="12" font-weight="bold">Ripple Carry Adder &amp; MUX/DEMUX</text>

    <!-- 4 Full Adder Blocks -->
    <g transform="translate(25, 60)">
      <!-- FA 0 -->
      <rect x="0" y="0" width="55" height="70" rx="4" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="27" y="38" fill="#c084fc" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">FA 0</text>

      <!-- Carry Line -->
      <line x1="55" y1="35" x2="75" y2="35" stroke="#f59e0b" stroke-width="2"/>

      <!-- FA 1 -->
      <rect x="75" y="0" width="55" height="70" rx="4" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="102" y="38" fill="#c084fc" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">FA 1</text>

      <!-- Carry Line -->
      <line x1="130" y1="35" x2="150" y2="35" stroke="#f59e0b" stroke-width="2"/>

      <!-- FA 2 -->
      <rect x="150" y="0" width="55" height="70" rx="4" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="177" y="38" fill="#c084fc" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">FA 2</text>

      <!-- Carry Line -->
      <line x1="205" y1="35" x2="225" y2="35" stroke="#f59e0b" stroke-width="2"/>

      <!-- FA 3 -->
      <rect x="225" y="0" width="55" height="70" rx="4" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="252" y="38" fill="#c084fc" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">FA 3</text>

      <!-- Cout -->
      <line x1="280" y1="35" x2="300" y2="35" stroke="#ef4444" stroke-width="2"/>
      <text x="288" y="25" fill="#ef4444" font-family="monospace" font-size="9">C_out</text>

      <!-- Sum lines downward -->
      <line x1="27" y1="70" x2="27" y2="90" stroke="#10b981" stroke-width="2"/>
      <line x1="102" y1="70" x2="102" y2="90" stroke="#10b981" stroke-width="2"/>
      <line x1="177" y1="70" x2="177" y2="90" stroke="#10b981" stroke-width="2"/>
      <line x1="252" y1="70" x2="252" y2="90" stroke="#10b981" stroke-width="2"/>
      <text x="27" y="104" fill="#10b981" font-family="monospace" font-size="9" text-anchor="middle">S0</text>
      <text x="102" y="104" fill="#10b981" font-family="monospace" font-size="9" text-anchor="middle">S1</text>
      <text x="177" y="104" fill="#10b981" font-family="monospace" font-size="9" text-anchor="middle">S2</text>
      <text x="252" y="104" fill="#10b981" font-family="monospace" font-size="9" text-anchor="middle">S3</text>
    </g>

    <!-- Lab Experiments Box -->
    <rect x="20" y="195" width="280" height="110" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="218" fill="#38bdf8" font-family="monospace" font-size="10">• Half &amp; Full Subtractor Circuits</text>
    <text x="30" y="238" fill="#a7f3d0" font-family="monospace" font-size="10">• 4:1 Multiplexer &amp; 1:4 Demultiplexer</text>
    <text x="30" y="258" fill="#f59e0b" font-family="monospace" font-size="10">• PN Junction Diode V-I Profile</text>
    <text x="30" y="278" fill="#c084fc" font-family="monospace" font-size="10">• Half-Wave Rectifier with π-Section Filter</text>
    <text x="30" y="295" fill="#94a3b8" font-family="monospace" font-size="9">• Ripple Factor &amp; Regulation Analysis</text>
  </g>
</svg>

