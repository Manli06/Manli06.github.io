<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="simBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="stressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="85%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="colorbar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#simBg)"/>

  <!-- Title Badge -->
  <rect x="50" y="30" width="410" height="34" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="65" y="52" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="13" font-weight="700">PROJECT 02: COMSOL MULTIPHYSICS PIEZO FEA</text>

  <!-- Simulation Workspace Area -->
  <rect x="50" y="85" width="600" height="325" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
  <text x="75" y="115" fill="#64748b" font-family="monospace" font-size="11">Solid Mechanics (solid) &amp; Electrostatics (es) Multiphysics Coupling</text>

  <!-- Mesh Grid Visualization -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.6">
    <line x1="120" y1="180" x2="520" y2="180"/>
    <line x1="120" y1="215" x2="520" y2="230"/>
    <line x1="120" y1="250" x2="520" y2="280"/>
    <!-- Mesh diagonals -->
    <path d="M 120 180 L 160 216 L 160 252 L 200 218 L 240 256 L 280 221 L 320 260 L 360 225 L 400 265 L 440 229 L 480 272 L 520 230" fill="none"/>
    <path d="M 120 250 L 160 216 L 200 180 L 240 219 L 280 180 L 320 223 L 360 180 L 400 227 L 440 180 L 480 230 L 520 280" fill="none"/>
  </g>

  <!-- Cantilever Beam with von Mises Stress / Electric Potential gradient -->
  <!-- Fixed boundary at left -->
  <rect x="95" y="160" width="25" height="110" fill="#475569" rx="3"/>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="95" y1="170" x2="85" y2="180"/>
    <line x1="95" y1="190" x2="85" y2="200"/>
    <line x1="95" y1="210" x2="85" y2="220"/>
    <line x1="95" y1="230" x2="85" y2="240"/>
    <line x1="95" y1="250" x2="85" y2="260"/>
  </g>
  <text x="75" y="285" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Fixed Constraint</text>

  <!-- Deflected Cantilever Layer 1 (Aluminium Substrate) -->
  <path d="M 120 225 Q 320 230, 520 270 L 520 285 Q 320 245, 120 240 Z" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="320" y="275" fill="#cbd5e1" font-family="monospace" font-size="10">Substrate: Aluminium</text>

  <!-- Layer 2 (Piezo PZT-5H / PVDF layer) with stress gradient -->
  <path d="M 120 205 Q 320 210, 520 250 L 520 270 Q 320 230, 120 225 Z" fill="url(#stressGrad)" opacity="0.9" stroke="#ffffff" stroke-width="1"/>
  <text x="320" y="195" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">Piezo Layer: PZT-5H / PVDF</text>

  <!-- Deflection Force Vector at Tip -->
  <g transform="translate(520, 210)">
    <line x1="0" y1="0" x2="0" y2="35" stroke="#ef4444" stroke-width="3"/>
    <polygon points="0,40 -6,28 6,28" fill="#ef4444"/>
    <text x="12" y="25" fill="#ef4444" font-family="monospace" font-size="11" font-weight="bold">F (Dynamic Load)</text>
  </g>

  <!-- Electric Potential Markers -->
  <circle cx="210" cy="212" r="4" fill="#ef4444"/>
  <text x="220" y="205" fill="#fca5a5" font-family="monospace" font-size="10">Max Stress: σ_max</text>
  <circle cx="480" cy="245" r="4" fill="#38bdf8"/>
  <text x="440" y="325" fill="#38bdf8" font-family="monospace" font-size="10">Max Displacement: δ_max</text>

  <!-- Color Legend on the Right -->
  <g transform="translate(680, 110)">
    <rect x="0" y="0" width="18" height="250" rx="3" fill="url(#colorbar)"/>
    <text x="30" y="12" fill="#ef4444" font-family="monospace" font-size="11">High (σ / V)</text>
    <text x="30" y="130" fill="#10b981" font-family="monospace" font-size="11">Med</text>
    <text x="30" y="248" fill="#3b82f6" font-family="monospace" font-size="11">0 (Ref)</text>
    <text x="-5" y="-15" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">Stress / V Contour</text>
  </g>

  <!-- Simulation Parameters Box -->
  <g transform="translate(70, 335)">
    <rect x="0" y="0" width="560" height="60" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="22" fill="#38bdf8" font-family="monospace" font-size="10">• Study: Stationary &amp; Frequency Domain</text>
    <text x="20" y="42" fill="#94a3b8" font-family="monospace" font-size="10">• Physics: Piezoelectricity (pzd) Multiphysics</text>
    <text x="300" y="22" fill="#38bdf8" font-family="monospace" font-size="10">• Materials: PZT-5H, PVDF, Al 6061</text>
    <text x="300" y="42" fill="#10b981" font-family="monospace" font-size="10">• Mesh: User-controlled Extremely Fine</text>
  </g>
</svg>

