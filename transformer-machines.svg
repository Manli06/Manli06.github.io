<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="tmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#tmBg)"/>

  <!-- Title Badge -->
  <rect x="50" y="30" width="460" height="34" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="65" y="52" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="13" font-weight="700">PROJECT 04: ELECTRICAL MACHINES &amp; TRANSFORMERS</text>

  <!-- Left: Single-Phase Transformer Core & OC/SC Setup -->
  <g transform="translate(50, 90)">
    <rect width="360" height="320" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="30" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">Single-Phase Transformer: OC &amp; SC Test</text>

    <!-- Transformer Core -->
    <rect x="70" y="70" width="220" height="150" rx="6" fill="none" stroke="#64748b" stroke-width="22"/>
    <rect x="105" y="105" width="150" height="80" rx="2" fill="#090d16" stroke="#334155" stroke-width="1"/>

    <!-- Primary Winding (Copper) -->
    <g stroke="#f59e0b" stroke-width="4">
      <line x1="50" y1="100" x2="70" y2="100"/>
      <line x1="50" y1="120" x2="70" y2="120"/>
      <line x1="50" y1="140" x2="70" y2="140"/>
      <line x1="50" y1="160" x2="70" y2="160"/>
      <line x1="50" y1="180" x2="70" y2="180"/>
    </g>
    <text x="35" y="145" fill="#f59e0b" font-family="monospace" font-size="11" text-anchor="middle">V₁</text>

    <!-- Secondary Winding (Cyan) -->
    <g stroke="#00d2ff" stroke-width="4">
      <line x1="290" y1="100" x2="310" y2="100"/>
      <line x1="290" y1="120" x2="310" y2="120"/>
      <line x1="290" y1="140" x2="310" y2="140"/>
      <line x1="290" y1="160" x2="310" y2="160"/>
      <line x1="290" y1="180" x2="310" y2="180"/>
    </g>
    <text x="325" y="145" fill="#00d2ff" font-family="monospace" font-size="11" text-anchor="middle">V₂</text>

    <!-- Magnetic Flux Phi -->
    <ellipse cx="180" cy="145" rx="75" ry="40" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="180" y="150" fill="#10b981" font-family="monospace" font-size="12" text-anchor="middle">Φ_m (Flux)</text>

    <!-- Equivalent Parameters Box -->
    <rect x="20" y="240" width="320" height="65" rx="4" fill="#0f172a" stroke="#1e293b"/>
    <text x="30" y="260" fill="#38bdf8" font-family="monospace" font-size="10">• Open-Circuit: Core Loss (W_o), R_o &amp; X_m</text>
    <text x="30" y="280" fill="#f59e0b" font-family="monospace" font-size="10">• Short-Circuit: Copper Loss (W_sc), R_eq &amp; X_eq</text>
    <text x="30" y="296" fill="#10b981" font-family="monospace" font-size="10">• Efficiency η % &amp; Voltage Regulation</text>
  </g>

  <!-- Right: B-H Hysteresis Loop & DC Motor Characteristics -->
  <g transform="translate(430, 90)">
    <rect width="320" height="320" rx="8" fill="#050914" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="30" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="bold">B-H Curve / Magnetic Hysteresis</text>

    <!-- Axes H and B -->
    <line x1="30" y1="150" x2="290" y2="150" stroke="#64748b" stroke-width="1.5"/>
    <line x1="160" y1="40" x2="160" y2="260" stroke="#64748b" stroke-width="1.5"/>
    <text x="285" y="140" fill="#94a3b8" font-family="monospace" font-size="11">H (A/m)</text>
    <text x="170" y="50" fill="#94a3b8" font-family="monospace" font-size="11">B (Tesla)</text>

    <!-- Hysteresis Loop -->
    <path d="M 60 70 C 130 60, 240 65, 260 75 C 240 140, 200 170, 160 195 C 120 220, 80 230, 60 225 C 80 160, 120 130, 160 105 C 200 80, 240 70, 260 75" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
    <circle cx="160" cy="92" r="3" fill="#f59e0b"/>
    <text x="170" y="96" fill="#f59e0b" font-family="monospace" font-size="9">Br (Retentivity)</text>
    <circle cx="115" cy="150" r="3" fill="#38bdf8"/>
    <text x="65" y="142" fill="#38bdf8" font-family="monospace" font-size="9">-Hc (Coercivity)</text>

    <!-- Lab Highlights box -->
    <rect x="20" y="268" width="280" height="38" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="283" fill="#38bdf8" font-family="monospace" font-size="9">• CRO Trace for Ferromagnetic Core</text>
    <text x="30" y="297" fill="#e2e8f0" font-family="monospace" font-size="9">• DC Shunt Motor Speed: Armature &amp; Field Control</text>
  </g>
</svg>

