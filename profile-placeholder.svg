<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3a7bd5" />
    </linearGradient>
    <pattern id="circuitGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="2" fill="#00d2ff" fill-opacity="0.3"/>
      <circle cx="40" cy="0" r="2" fill="#00d2ff" fill-opacity="0.3"/>
      <circle cx="0" cy="40" r="2" fill="#00d2ff" fill-opacity="0.3"/>
      <circle cx="40" cy="40" r="2" fill="#00d2ff" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="24" fill="url(#bgGrad)" />
  <rect width="500" height="500" rx="24" fill="url(#circuitGrid)" />

  <!-- Outer Tech Ring -->
  <circle cx="250" cy="220" r="160" fill="none" stroke="#1e293b" stroke-width="4"/>
  <circle cx="250" cy="220" r="148" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.7"/>

  <!-- Circuit nodes -->
  <line x1="80" y1="220" x2="120" y2="220" stroke="#00d2ff" stroke-width="2" opacity="0.6"/>
  <circle cx="80" cy="220" r="4" fill="#00d2ff"/>
  <line x1="380" y1="220" x2="420" y2="220" stroke="#00d2ff" stroke-width="2" opacity="0.6"/>
  <circle cx="420" cy="220" r="4" fill="#00d2ff"/>
  <line x1="250" y1="50" x2="250" y2="90" stroke="#00d2ff" stroke-width="2" opacity="0.6"/>
  <circle cx="250" cy="50" r="4" fill="#00d2ff"/>

  <!-- Avatar Silhouette -->
  <g fill="#334155">
    <circle cx="250" cy="180" r="60" fill="#475569" stroke="#64748b" stroke-width="2"/>
    <path d="M 140 330 C 140 270, 185 250, 250 250 C 315 250, 360 270, 360 330 C 360 350, 340 360, 250 360 C 160 360, 140 350, 140 330 Z" fill="#334155" stroke="#475569" stroke-width="2"/>
    <polygon points="230,252 250,285 270,252" fill="#1e293b" stroke="#00d2ff" stroke-width="1.5"/>
  </g>

  <!-- Technical Overlay Badge -->
  <g transform="translate(100, 400)">
    <rect width="300" height="54" rx="27" fill="#0f172a" stroke="#00d2ff" stroke-width="1.5" opacity="0.95"/>
    <text x="150" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.5">MANLI H KONYAK</text>
    <text x="150" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" letter-spacing="0.5">EEE Student • NIT Nagaland</text>
  </g>
</svg>

