<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#020c1b" />
    </linearGradient>
    <linearGradient id="piezoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0066cc" />
    </linearGradient>
    <linearGradient id="harvGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#p1Grad)"/>

  <!-- Circuit lines pattern -->
  <g stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="100" y1="50" x2="100" y2="400"/>
    <line x1="250" y1="50" x2="250" y2="400"/>
    <line x1="450" y1="50" x2="450" y2="400"/>
    <line x1="650" y1="50" x2="650" y2="400"/>
    <line x1="50" y1="120" x2="750" y2="120"/>
    <line x1="50" y1="320" x2="750" y2="320"/>
  </g>

  <!-- Title Badge -->
  <rect x="50" y="30" width="360" height="34" rx="6" fill="#0f172a" stroke="#00d2ff" stroke-width="1.5"/>
  <text x="65" y="52" fill="#00d2ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13" font-weight="700">PROJECT 01: PIEZOELECTRIC ENERGY HARVESTING</text>

  <!-- Footstep Pressure Force Vectors -->
  <g transform="translate(100, 100)">
    <rect x="0" y="50" width="130" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="65" y="85" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Footstep</text>
    <text x="65" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Mechanical Force</text>
    <polygon points="65,150 55,135 75,135" fill="#38bdf8"/>
    <line x1="65" y1="120" x2="65" y2="145" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <!-- Arrow -->
  <path d="M 250 195 L 290 195" stroke="#00d2ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <polygon points="295,195 285,190 285,200" fill="#00d2ff"/>

  <!-- Piezo Transducer Array -->
  <g transform="translate(310, 130)">
    <rect x="0" y="0" width="140" height="130" rx="12" fill="#0f172a" stroke="#00d2ff" stroke-width="2"/>
    <circle cx="70" cy="50" r="32" fill="url(#piezoGrad)" opacity="0.85"/>
    <circle cx="70" cy="50" r="20" fill="#0a192f" stroke="#ffffff" stroke-width="1.5"/>
    <text x="70" y="54" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="bold" text-anchor="middle">PZT / PVDF</text>
    <text x="70" y="105" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Piezo Disc Array</text>
    <text x="70" y="120" fill="#00d2ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">AC Voltage Gen</text>
  </g>

  <!-- Arrow -->
  <polygon points="485,195 475,190 475,200" fill="#10b981"/>
  <line x1="450" y1="195" x2="480" y2="195" stroke="#10b981" stroke-width="2.5"/>

  <!-- Power Management & Rectifier -->
  <g transform="translate(500, 130)">
    <rect x="0" y="0" width="130" height="130" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <path d="M 40 40 L 65 25 L 90 40 L 65 55 Z" fill="#10b981" opacity="0.3" stroke="#10b981" stroke-width="1.5"/>
    <text x="65" y="44" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">~ / =</text>
    <text x="65" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Rectifier &amp; Cap</text>
    <text x="65" y="98" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">LTC3588 / Filter</text>
    <text x="65" y="115" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Regulated DC</text>
  </g>

  <!-- Arrow to IoT -->
  <path d="M 630 195 L 670 195" stroke="#f59e0b" stroke-width="2.5"/>
  <polygon points="675,195 665,190 665,200" fill="#f59e0b"/>

  <!-- Raspberry Pi & Sensor Integration -->
  <g transform="translate(680, 130)">
    <rect x="0" y="0" width="95" height="130" rx="10" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="47" y="45" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Raspberry Pi</text>
    <text x="47" y="65" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" text-anchor="middle">&amp; Python</text>
    <text x="47" y="95" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Telemetry &amp;</text>
    <text x="47" y="110" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" text-anchor="middle">Monitoring</text>
  </g>

  <!-- Energy Pulse Waveform Graph at bottom -->
  <g transform="translate(100, 310)">
    <rect x="0" y="0" width="600" height="90" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <line x1="20" y1="45" x2="580" y2="45" stroke="#1e293b" stroke-width="1"/>
    <path d="M 30 45 Q 60 45, 75 15 Q 90 -10, 105 45 Q 120 70, 135 45 L 200 45 Q 220 45, 235 12 Q 250 -15, 265 45 Q 280 65, 295 45 L 380 45 Q 400 45, 415 10 Q 430 -20, 445 45 Q 460 70, 475 45 L 570 45" fill="none" stroke="#00d2ff" stroke-width="2.5"/>
    <text x="40" y="25" fill="#38bdf8" font-family="monospace" font-size="11">Piezoelectric Output Voltage Transient (V vs t)</text>
    <text x="500" y="80" fill="#10b981" font-family="monospace" font-size="11">● Active Pulse</text>
  </g>
</svg>

