<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="csBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#csBg)"/>

  <!-- Title Badge -->
  <rect x="50" y="30" width="440" height="34" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="65" y="52" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="13" font-weight="700">PROJECT 03: CONTROL SYSTEMS &amp; STATE-SPACE MODELLING</text>

  <!-- Left: State Space Block Diagram -->
  <g transform="translate(50, 90)">
    <rect width="360" height="320" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="30" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">State-Space Model: ẋ = Ax + Bu, y = Cx + Du</text>

    <!-- Summing junction -->
    <circle cx="50" cy="140" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="50" y="144" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">+</text>

    <!-- Input u(t) -->
    <line x1="10" y1="140" x2="36" y2="140" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="36,140 28,136 28,144" fill="#38bdf8"/>
    <text x="12" y="130" fill="#94a3b8" font-family="monospace" font-size="10">u(t)</text>

    <!-- B Matrix -->
    <rect x="90" y="120" width="40" height="40" rx="4" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="110" y="145" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">B</text>
    <line x1="64" y1="140" x2="90" y2="140" stroke="#38bdf8" stroke-width="2"/>

    <!-- Integrator 1/s -->
    <rect x="170" y="120" width="45" height="40" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="192" y="145" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">∫ 1/s</text>
    <line x1="130" y1="140" x2="170" y2="140" stroke="#38bdf8" stroke-width="2"/>

    <!-- C Matrix -->
    <rect x="255" y="120" width="40" height="40" rx="4" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="275" y="145" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">C</text>
    <line x1="215" y1="140" x2="255" y2="140" stroke="#38bdf8" stroke-width="2"/>

    <!-- Output y(t) -->
    <line x1="295" y1="140" x2="345" y2="140" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="345,140 335,136 335,144" fill="#38bdf8"/>
    <text x="325" y="130" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">y(t)</text>

    <!-- Feedback A Matrix -->
    <path d="M 235 140 L 235 210 L 210 210" stroke="#f59e0b" stroke-width="2"/>
    <rect x="170" y="190" width="40" height="40" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="190" y="215" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">A</text>
    <path d="M 170 210 L 50 210 L 50 154" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="50,154 46,164 54,164" fill="#f59e0b"/>

    <text x="190" y="270" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">MATLAB / Simulink Dynamic Solver</text>
    <text x="190" y="295" fill="#10b981" font-family="monospace" font-size="10" text-anchor="middle">Eigenvalues λ, Controllability &amp; Observability</text>
  </g>

  <!-- Right: Step Response Oscilloscope Graph -->
  <g transform="translate(430, 90)">
    <rect width="320" height="320" rx="8" fill="#050914" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="30" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">Step Response &amp; Transient Analysis</text>

    <!-- Graph Grid -->
    <g stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3 3">
      <line x1="40" y1="60" x2="290" y2="60"/>
      <line x1="40" y1="110" x2="290" y2="110"/>
      <line x1="40" y1="160" x2="290" y2="160"/>
      <line x1="40" y1="210" x2="290" y2="210"/>
      <line x1="100" y1="50" x2="100" y2="240"/>
      <line x1="160" y1="50" x2="160" y2="240"/>
      <line x1="220" y1="50" x2="220" y2="240"/>
    </g>

    <!-- Axes -->
    <line x1="40" y1="240" x2="295" y2="240" stroke="#64748b" stroke-width="1.5"/>
    <line x1="40" y1="45" x2="40" y2="240" stroke="#64748b" stroke-width="1.5"/>
    <text x="290" y="258" fill="#64748b" font-family="monospace" font-size="10">t (s)</text>
    <text x="15" y="50" fill="#64748b" font-family="monospace" font-size="10">Amp</text>

    <!-- Steady State Line -->
    <line x1="40" y1="110" x2="290" y2="110" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="225" y="102" fill="#94a3b8" font-family="monospace" font-size="9">Steady State = 1.0</text>

    <!-- Step Response Curve with Overshoot -->
    <path d="M 40 240 Q 65 240, 80 180 Q 95 65, 115 70 Q 135 75, 150 125 Q 165 135, 185 105 Q 200 98, 220 110 L 290 110" fill="none" stroke="#00d2ff" stroke-width="2.5"/>

    <!-- Peak Annotation -->
    <circle cx="115" cy="70" r="3.5" fill="#ef4444"/>
    <text x="125" y="65" fill="#f87171" font-family="monospace" font-size="9">Peak Mp: 18.4%</text>

    <!-- Rise Time / Settling Time annotation -->
    <rect x="40" y="270" width="250" height="35" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="50" y="285" fill="#38bdf8" font-family="monospace" font-size="9">• Rise Time (tr): 0.35s  • Peak (tp): 0.72s</text>
    <text x="50" y="298" fill="#10b981" font-family="monospace" font-size="9">• Settling Time (ts &lt; 2%): 1.48s</text>
  </g>
</svg>

