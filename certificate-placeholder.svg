<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" fill="url(#certBg)" rx="12"/>

  <!-- Ornate Border -->
  <rect x="25" y="25" width="750" height="500" rx="8" fill="none" stroke="#334155" stroke-width="2"/>
  <rect x="35" y="35" width="730" height="480" rx="6" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8 4"/>

  <!-- Corner Ornaments -->
  <g fill="#fbbf24">
    <polygon points="35,35 60,35 35,60"/>
    <polygon points="765,35 740,35 765,60"/>
    <polygon points="35,515 60,515 35,490"/>
    <polygon points="765,515 740,515 765,490"/>
  </g>

  <!-- Certificate Header -->
  <g transform="translate(400, 110)" text-anchor="middle">
    <text y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" letter-spacing="4" font-weight="600">ACADEMIC &amp; TECHNICAL CERTIFICATION</text>
    <text y="45" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800" letter-spacing="2">CERTIFICATE OF ACHIEVEMENT</text>
    <line x1="-120" y1="65" x2="120" y2="65" stroke="url(#goldGrad)" stroke-width="2"/>
  </g>

  <!-- Body Content -->
  <g transform="translate(400, 230)" text-anchor="middle">
    <text y="0" fill="#94a3b8" font-family="sans-serif" font-size="14">THIS CERTIFIES THAT</text>
    <text y="42" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">MANLI H KONYAK</text>
    <text y="70" fill="#cbd5e1" font-family="sans-serif" font-size="13">B.Tech Electrical and Electronic Engineering • NIT Nagaland</text>
    
    <text y="115" fill="#94a3b8" font-family="sans-serif" font-size="14">HAS SUCCESSFULLY COMPLETED / PARTICIPATED IN</text>
    <rect x="-240" y="130" width="480" height="38" rx="6" fill="#090d16" stroke="#334155"/>
    <text y="154" fill="#fbbf24" font-family="monospace" font-size="14" font-weight="bold">[ADD CERTIFICATE COURSE / WORKSHOP NAME]</text>
  </g>

  <!-- Seal / Badge -->
  <g transform="translate(200, 440)">
    <circle cx="0" cy="0" r="36" fill="#090d16" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="0,-16 5,-5 16,-5 8,3 11,14 0,7 -11,14 -8,3 -16,-5 -5,-5" fill="#fbbf24"/>
    <!-- Ribbons -->
    <path d="M -12 28 L -18 55 L -6 48 L 0 55 L 0 30" fill="#d97706"/>
    <path d="M 12 28 L 18 55 L 6 48 L 0 55 L 0 30" fill="#d97706"/>
  </g>

  <!-- Signature Placeholders -->
  <g transform="translate(560, 440)" text-anchor="middle">
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#64748b" stroke-width="1"/>
    <text y="18" fill="#94a3b8" font-family="sans-serif" font-size="12">[ADD ISSUING AUTHORITY]</text>
    <text y="34" fill="#64748b" font-family="sans-serif" font-size="10">National Institute of Technology, Nagaland / Org</text>
  </g>
</svg>

